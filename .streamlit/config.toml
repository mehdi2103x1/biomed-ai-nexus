# Streamlit configuration for HepatoScope
# ---------------------------------------------------------------------------
# Custom radio-based sidebar router in app.py — disable the automatic multipage
# navigation so Streamlit doesn't also list pages/ modules as auto-pages.
[client]
showSidebarNavigation = false
showErrorDetails = true

# Claude-inspired warm light theme (cream canvas, terracotta accent, charcoal text).
[theme]
base = "light"
primaryColor = "#cc785c"
backgroundColor = "#faf9f5"
secondaryBackgroundColor = "#f2efe6"
textColor = "#2b2a26"
font = "sans serif"

[server]
maxUploadSize = 20
headless = true
