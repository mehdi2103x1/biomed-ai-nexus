# Streamlit configuration for BioMed AI Nexus
# ---------------------------------------------------------------------------
# We use a *custom* radio-based sidebar router in app.py. Disabling the
# automatic multipage navigation stops Streamlit from also listing the modules
# inside pages/ as separate auto-pages (which would duplicate the menu).
[client]
showSidebarNavigation = false
showErrorDetails = true

[theme]
base = "dark"
primaryColor = "#10b981"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b26"
textColor = "#e6edf3"
font = "sans serif"

[server]
maxUploadSize = 20
headless = true
